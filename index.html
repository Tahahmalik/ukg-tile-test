<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UKG Tile Diagnostics</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 20px;
            background: #f5f5f5;
        }

        h1 {
            color: #0078d4;
        }

        h2 {
            margin-top: 30px;
        }

        pre {
            background: white;
            border: 1px solid #ddd;
            padding: 12px;
            overflow: auto;
            white-space: pre-wrap;
            word-break: break-word;
        }
    </style>
</head>
<body>

    <h1>UKG Tile Diagnostics</h1>

    <h2>Environment</h2>
    <pre id="env">Loading...</pre>

    <h2>Messages</h2>
    <pre id="messages">Waiting for messages...</pre>

    <h2>UserInfo Test</h2>
    <pre id="userinfo">Testing...</pre>

    <h2>Cookies</h2>
    <pre id="cookies">Loading...</pre>

 <script>

document.getElementById("env").textContent =
JSON.stringify({
    href: location.href,
    search: location.search,
    referrer: document.referrer,
    embedded: window.self !== window.top
}, null, 2);

window.addEventListener("message", function(event) {

    document.getElementById("messages").textContent +=
        JSON.stringify({
            timestamp: new Date().toISOString(),
            origin: event.origin,
            data: event.data
        }, null, 2) + "\n\n";

    console.log("MESSAGE RECEIVED:", event);

});

document.getElementById("userinfo").textContent =
    "Message listener active";

window.parent.postMessage({
    source: "ukg-test",
    action: "ready"
}, "*");

</script>

</body>
</html>
